<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Energy checklist</title>
<style>
  :root{
    --bg:#0b0e0a;
    --card:#12160f;
    --line:#2a3324;
    --green:#8fd400;
    --green-dim:#3f5a1a;
    --text:#eef3e6;
    --text-dim:#8ea082;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;}
  h1{
    font-size:26px;
    letter-spacing:1px;
    margin:0 0 4px;
    color:var(--green);
    text-transform:uppercase;
    font-weight:800;
  }
  header p{margin:0;color:var(--text-dim);font-size:13px;}

  .progress-bar-outer{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    height:14px;
    margin:16px 0 6px;
    overflow:hidden;
  }
  .progress-bar-inner{
    height:100%;
    background:linear-gradient(90deg,var(--green-dim),var(--green));
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .progress-label strong{color:var(--green);}

  .controls{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  button.ctrl{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  button.ctrl:hover{border-color:var(--green);color:var(--green);}

  .section{margin-bottom:26px;}
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--green);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .section-title span.count{color:var(--text-dim);letter-spacing:0;text-transform:none;font-size:12px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
  }
  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    user-select:none;
    transition:border-color .15s, background .15s;
  }
  .item:hover{border-color:var(--green-dim);}
  .item.checked{
    background:rgba(143,212,0,0.08);
    border-color:var(--green);
  }
  .box{
    flex:0 0 18px;
    width:18px;
    height:18px;
    border:1.5px solid var(--text-dim);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--bg);
  }
  .item.checked .box{
    background:var(--green);
    border-color:var(--green);
  }
  .item.checked .box::after{content:"✓";color:#0b0e0a;font-weight:800;}
  .label{font-size:13.5px;line-height:1.3;}
  .item.checked .label{color:var(--text-dim);text-decoration:line-through;}

  footer{text-align:center;margin-top:30px;font-size:11px;color:var(--text-dim);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monster Energy checklist</h1>
    <p>Tap a can flavor to mark it tried. Progress saves automatically.</p>
  </header>

  <div class="progress-bar-outer"><div class="progress-bar-inner" id="bar"></div></div>
  <div class="progress-label" id="progress-text">Loading…</div>

  <div class="controls">
    <button class="ctrl" id="clear-btn">Clear all</button>
  </div>

  <div id="sections"></div>

  <footer>Data stored privately on this device/account only.</footer>
</div>

<script>
const DATA = [
  {
    title: "Main Monster energy lines",
    items: ["Original Monster","Monster Ultra","Juice Monster","Rehab Monster","Java Monster","Monster Reserve","Monster Import","Punch Monster","Hydro Monster","Dragon Tea","Killer Brew","Espresso Monster","Muscle Monster"]
  },
  {
    title: "Popular original / mainline flavors",
    items: ["Original Green \"OG\"","Low-Carb","Zero Sugar","Absolutely Zero","Import","Nitro Super Dry","Ultra Cosmic Peach","Orange Dreamsicle","Peaches N' Crème","White Pineapple","Watermelon","Assault","The Doctor","Lando Norris","Electric Blue"]
  },
  {
    title: "Monster Ultra flavors",
    items: ["Ultra Zero \"White\"","Ultra Blue","Ultra Red","Ultra Black","Ultra Violet","Ultra Sunrise","Ultra Paradise","Ultra Fiesta Mango","Ultra Rosa","Ultra Watermelon","Ultra Peachy Dreams","Ultra Strawberry Dreams","Ultra Ruby Red","Ultra Vice","Ultra Blue Hawaiian","Ultra Wild Passion","Ultra Pink Lemonade","Ultra Red Raz"]
  },
  {
    title: "Juice / Punch Monster flavors",
    items: ["Mango Loco","Pacific Punch","Pipeline Punch","Rio Punch","Aussie Lemonade","Khaotic","Viking Berry","Bad Apple","Voodoo Grape","Strawberry Lemonade","Ripper","M-80","Khaos","Mixxd"]
  },
  {
    title: "Rehab Monster flavors",
    items: ["Tea + Lemonade","Peach Tea","Green Tea","Wild Berry Tea","Strawberry Tea","Watermelon Tea","Dragonade"]
  },
  {
    title: "Java Monster flavors",
    items: ["Mean Bean","Loco Moco","Salted Caramel","Cafe Latte","Irish Crème","French Vanilla","Mocha","Kona Blend","Vanilla Light"]
  }
];

const STORAGE_KEY = "monster-checklist-state";
let state = {};
const sectionsEl = document.getElementById('sections');
const barEl = document.getElementById('bar');
const progressText = document.getElementById('progress-text');

function slug(section, item){
  return (section + "__" + item).toLowerCase().replace(/[^a-z0-9]+/g,'-');
}

function totalCount(){
  return DATA.reduce((sum,s)=>sum+s.items.length,0);
}

function render(){
  sectionsEl.innerHTML = "";
  DATA.forEach(section=>{
    const secDiv = document.createElement('div');
    secDiv.className = 'section';

    const checkedInSection = section.items.filter(i=>state[slug(section.title,i)]).length;

    const titleDiv = document.createElement('div');
    titleDiv.className = 'section-title';
    titleDiv.innerHTML = '<span>'+section.title+'</span><span class="count">'+checkedInSection+' / '+section.items.length+'</span>';
    secDiv.appendChild(titleDiv);

    const gridDiv = document.createElement('div');
    gridDiv.className = 'grid';

    section.items.forEach(item=>{
      const key = slug(section.title,item);
      const itemDiv = document.createElement('div');
      itemDiv.className = 'item' + (state[key] ? ' checked' : '');
      itemDiv.innerHTML = '<div class="box"></div><div class="label">'+item+'</div>';
      itemDiv.addEventListener('click', ()=>toggle(key));
      gridDiv.appendChild(itemDiv);
    });

    secDiv.appendChild(gridDiv);
    sectionsEl.appendChild(secDiv);
  });
  updateProgress();
}

function updateProgress(){
  const total = totalCount();
  const checked = Object.values(state).filter(Boolean).length;
  const pct = total ? Math.round((checked/total)*100) : 0;
  barEl.style.width = pct + '%';
  progressText.innerHTML = '<strong>'+checked+' / '+total+'</strong> tried &middot; '+pct+'%';
}

async function toggle(key){
  state[key] = !state[key];
  render();
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Save failed', e);
  }
}

async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY);
    state = result ? JSON.parse(result.value) : {};
  }catch(e){
    state = {};
  }
  render();
}

document.getElementById('clear-btn').addEventListener('click', async ()=>{
  if(!confirm('Clear all checked flavors?')) return;
  state = {};
  render();
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Clear failed', e);
  }
});

loadState();
</script>
</body>
</html>
